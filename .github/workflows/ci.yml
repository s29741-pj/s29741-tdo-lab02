name: Mission Control CI
run-name: ${{ github.event_name }} / ${{ inputs.configuration || 'Release' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      configuration:
        description: Konfiguracja budowania
        type: choice
        options:
          - Release
          - Debug
        default: Release
      extra_diagnostics:
        description: Wypisz dodatkowe informacje diagnostyczne
        type: boolean
        default: false

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    env:
      BUILD_CONFIGURATION: ${{ inputs.configuration || 'Release' }}
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Przygotuj .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Sprawdz Docker
        run: docker version

      - name: Dodatkowa diagnostyka
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.extra_diagnostics }}
        run: |
          dotnet --info
          docker info

      - name: Sprawdz lockfiles backendu
        run: |
          test -f backend/packages.lock.json
          test -f backend.tests/packages.lock.json

      - name: Przywroc zaleznosci (locked)
        run: dotnet restore MissionControl.slnx --locked-mode

      - name: Zbuduj backend
        run: dotnet build MissionControl.slnx --configuration "$BUILD_CONFIGURATION"

      - name: Uruchom testy backendu
        run: dotnet test MissionControl.slnx --configuration "$BUILD_CONFIGURATION"

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Sprawdz lockfile frontendu
        run: test -f package-lock.json

      - name: Zainstaluj zaleznosci
        run: npm ci

      - name: Zbuduj frontend
        run: npm run build

      - name: Uruchom testy frontendu
        run: npm test