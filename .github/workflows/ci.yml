name: Mission Control CI
run-name: ${{ github.event_name }} / ${{ inputs.configuration || 'Release' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      configuration:
        description: Konfiguracja budowania
        type: choice
        options:
          - Release
          - Debug
        default: Release
      extra_diagnostics:
        description: Wypisz dodatkowe informacje diagnostyczne
        type: boolean
        default: false

jobs:
  hello:
    runs-on: ubuntu-24.04
    env:
      BUILD_CONFIGURATION: ${{ inputs.configuration || 'Release' }}
    steps:
      - name: Powitanie
        run: echo "Czesc, to moj pierwszy workflow!"

      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Przygotuj .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Sprawdz pliki i wersje narzedzi
        run: |
          test -f MissionControl.slnx
          test -f global.json
          test -f .nvmrc
          dotnet --version
          node --version
          npm --version
      - name: Kontrolowany blad
        run: |
          echo "::warning file=README.md,line=1::To jest ostrzezenie cwiczeniowe"
          echo "::error file=README.md,line=1::Kontrolowany blad konfiguracji CI"
          exit 1

      - name: Pokaz wybrana konfiguracje
        run: |
          echo "Konfiguracja budowania: $BUILD_CONFIGURATION"

      - name: Dodatkowa diagnostyka
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.extra_diagnostics }}
        run: |
          dotnet --info
          docker version